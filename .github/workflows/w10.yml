name: w10
on:
  workflow_dispatch:
    inputs:
      kernel:
        default: ''
      args:
        default: ''
      soft:
        default: 'yes'
      builder:
        default: ''
      add_sources:
        default: ''
jobs:
  j1:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - env:
        DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
      run: bash hop/data.sh pull
    - run: python3 "$GITHUB_WORKSPACE/ci/r.py" "$GITHUB_WORKSPACE/ci/w10_j1_1.sh"
    - env:
        E1: ${{ inputs.soft }}
        E2: ${{ inputs.args }}
        E3: ${{ inputs.builder }}
      run: python3 "$GITHUB_WORKSPACE/ci/r.py" "$GITHUB_WORKSPACE/ci/w10_j1_2.sh"
    - env:
        KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        E1: ${{ inputs.kernel }}
        E2: ${{ inputs.add_sources }}
      run: python3 "$GITHUB_WORKSPACE/ci/r.py" "$GITHUB_WORKSPACE/ci/w10_j1_3.sh"
    - if: always()
      env:
        DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
      run: ls "$RUNNER_TEMP"/cilogs/*.log > /dev/null 2>&1 || exit 0; bash hop/data.sh release "logs-w10-${{ github.run_number }}" "logs w10 ${{ github.run_number }}" "step logs" "$RUNNER_TEMP"/cilogs/*.log || true
