name: w13
on:
  workflow_dispatch:
    inputs:
      ref:
        required: true
permissions:
  contents: write
jobs:
  j1:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - env:
        DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
      run: bash hop/data.sh ci
    - env:
        KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        E1: ${{ inputs.ref }}
      run: python3 "$GITHUB_WORKSPACE/ci/r.py" "$GITHUB_WORKSPACE/ci/w13_j1_1.sh"
    - env:
        GH_TOKEN: ${{ github.token }}
        DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
        CI_PRIV_RELEASES: '1'
      run: python3 "$GITHUB_WORKSPACE/ci/r.py" "$GITHUB_WORKSPACE/ci/w13_j1_2.sh"
    - if: always()
      env:
        DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
      run: ls "$RUNNER_TEMP"/cilogs/*.log > /dev/null 2>&1 || exit 0; bash hop/data.sh release "logs-w13-${{ github.run_number }}" "logs w13 ${{ github.run_number }}" "step logs" "$RUNNER_TEMP"/cilogs/*.log || true
