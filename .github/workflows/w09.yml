name: w09
on:
  schedule:
  - cron: 47 */3 * * *
  workflow_dispatch:
    inputs:
      dry:
        default: 'no'
permissions:
  contents: read
  actions: write
jobs:
  j1:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      R: repos/${{ github.repository }}
      DRY: ${{ inputs.dry || 'no' }}
    steps:
    - uses: actions/checkout@v4
    - env:
        DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
      run: bash hop/data.sh pull
    - run: python3 "$GITHUB_WORKSPACE/ci/r.py" "$GITHUB_WORKSPACE/ci/w09_j1_1.sh"
    - env:
        KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      run: python3 "$GITHUB_WORKSPACE/ci/r.py" "$GITHUB_WORKSPACE/ci/w09_j1_2.sh"
    - if: always()
      env:
        DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
      run: ls "$RUNNER_TEMP"/cilogs/*.log > /dev/null 2>&1 || exit 0; bash hop/data.sh release "logs-w09-${{ github.run_number }}" "logs w09 ${{ github.run_number }}" "step logs" "$RUNNER_TEMP"/cilogs/*.log || true
