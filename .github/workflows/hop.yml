name: hop
# Basin-hopping campaign for unit-square packings (n = 1..1000).
# Each matrix job builds Evan Daniel's `packer` and `fq` (MIT, github.com/evand/square-packing), hops its slice of the
# gap-weighted target list from our current packings (seeds/*.csv.gz and results/*.csv.gz), re-quenches every hop output with fq,
# certifies with the metric copy, and uploads its merged submission as an artifact. The final job merges the slices and
# publishes the result as a release asset (downloaded by our merge notebook).
on:
  workflow_dispatch:
    inputs:
      jobs:
        description: number of parallel jobs (slices)
        default: "20"
      hop_min:
        description: minutes of hop per job and candidate
        default: "24"
      seeds:
        description: hop seeds per candidate
        default: "2"
      seed0:
        description: first hop seed
        default: "1000"
      budget_h:
        description: wall-clock budget of the hop stage per job (hours)
        default: "5.0"
      targets:
        description: total number of targets (gap-ranked non-grid puzzles), split over the jobs
        default: "547"
      skip:
        description: skip the first N targets
        default: "0"
      hop_args:
        description: extra packer hop options passed through (e.g. "--descend 3e-5 --amp 0.7"; defaults 1e-4, 1.0)
        default: ""
      nmin:
        description: lowest puzzle size to hop (SQ_NMIN)
        default: "1"
      engine:
        description: hop = packer hop; shrink = fq --shrink --hops (HOP_ARGS then holds fq options); hhop = packer hhop (hard-square event-chain hopping); insert / insert2 = upward neighbour transfer (our n-1 / n-2 packing plus inserted squares, fq quench; HOP_ARGS = fq options, default --loosen 1.03)
        default: "hop"
      target_frac:
        description: target-side hop (engine hop only) - start the walk this fraction of the way from our side to the board side (0 = classic)
        default: "0"
      nlist:
        description: explicit comma-separated puzzle list (overrides the gap ranking; targets/skip then slice this list); "auto" = hop/soft_list.txt (kept up to date by the merge job)
        default: ""
      label:
        description: chain label; the merge is committed as seeds/<label>.csv.gz (empty = not committed)
        default: ""
      chain:
        description: number of further runs to dispatch automatically after this one (same inputs, seed0 + 1000)
        default: "0"

permissions:
  contents: write
  actions: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          n = int("${{ inputs.jobs }}")
          print("matrix=" + json.dumps({"slice": list(range(n))}))
          EOF

  hop:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: build packer and fq
        run: |
          git clone -q --depth 1 --filter=blob:none --sparse https://github.com/evand/square-packing.git evand
          cd evand && git sparse-checkout set --no-cone /search/packer/src/ /search/packer/Cargo.toml /search/packer/Cargo.lock
          cd search/packer && cargo build --release --bin fq --bin packer 2>&1 | tail -2
          ls -la target/release/fq target/release/packer
      - name: python deps
        run: pip install -q numpy mpmath
      - name: hop slice ${{ matrix.slice }}
        run: |
          mkdir -p out
          for f in seeds/*.csv.gz results/*.csv.gz; do n=$(basename "$f" .csv.gz); mkdir -p "seeds/$n"; gunzip -c "$f" > "seeds/$n/submission.csv"; done
          ls seeds
          cd hop
          J=${{ inputs.jobs }}; T=${{ inputs.targets }}; S=${{ matrix.slice }}
          NLIST="${{ inputs.nlist }}"; if [ "$NLIST" = "auto" ]; then NLIST=$(cat soft_list.txt); L=$(echo "$NLIST" | tr ',' '\n' | grep -c .); T=$(( L - ${{ inputs.skip }} )); [ "$T" -gt "${{ inputs.targets }}" ] && T=${{ inputs.targets }}; echo "auto list of $L puzzles, this run: $T after skip ${{ inputs.skip }}"; fi
          PER=$(( (T + J - 1) / J )); SKIP=$(( ${{ inputs.skip }} + S * PER ))
          echo "slice $S: targets $SKIP .. $((SKIP + PER))"
          FQ_BIN=$GITHUB_WORKSPACE/evand/search/packer/target/release/fq \
          PACKER_BIN=$GITHUB_WORKSPACE/evand/search/packer/target/release/packer \
          SQ_IN=$GITHUB_WORKSPACE/seeds SQ_WORK=$GITHUB_WORKSPACE/work SQ_BOARD=board_29oct.txt \
          SQ_WORKERS=$(nproc) SQ_MAXC=1 HOP_MIN=${{ inputs.hop_min }} HOP_SEEDS=${{ inputs.seeds }} \
          HOP_SEED0=$(( ${{ inputs.seed0 }} + S * 100 )) HOP_NTARGET=$PER HOP_SKIP=$SKIP \
          HOP_BUDGET_H=${{ inputs.budget_h }} FQ_DEADLINE=120 HOP_ARGS="${{ inputs.hop_args }}" SQ_NMIN=${{ inputs.nmin }} HOP_ENGINE=${{ inputs.engine }} HOP_NLIST="$NLIST" HOP_TARGET_FRAC=${{ inputs.target_frac }} \
          python3 -u sq10_hop.py $GITHUB_WORKSPACE/out/submission.csv | grep -v "^SIDES"
      - uses: actions/upload-artifact@v4
        with:
          name: hop-${{ matrix.slice }}
          path: out/submission.csv
          retention-days: 7

  merge:
    needs: hop
    if: ${{ !cancelled() }}    # runs after slice failures, not after a cancel (a cancel must stop a chain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: slices
      - name: python deps
        run: pip install -q numpy mpmath kaggle
      - name: fetch the latest Kaggle merge output (public packings included) when the Kaggle token is configured
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          if [ -z "$KAGGLE_KEY" ]; then echo "no Kaggle token: skipped"; exit 0; fi
          mkdir -p ~/.kaggle && printf '{"username":"%s","key":"%s"}' "$KAGGLE_USERNAME" "$KAGGLE_KEY" > ~/.kaggle/kaggle.json && chmod 600 ~/.kaggle/kaggle.json
          export KAGGLE_API_TOKEN="$KAGGLE_KEY"
          mkdir -p slices/kaggle_merge
          kaggle kernels output "$KAGGLE_USERNAME/notebook5586544269" -p slices/kaggle_merge && ls -la slices/kaggle_merge || echo "Kaggle output fetch failed"
          find slices/kaggle_merge -type f ! -name submission.csv -delete || true
      - name: certified merge of the slices and the seeds
        run: |
          mkdir -p out
          for f in seeds/*.csv.gz results/*.csv.gz; do n=$(basename "$f" .csv.gz); mkdir -p "slices/$n"; gunzip -c "$f" > "slices/$n/submission.csv"; done
          ls slices
          cd hop
          SQ_IN=$GITHUB_WORKSPACE/slices SQ_QUENCH=0 SQ_MAXC=3 SQ_WORKERS=$(nproc) \
          python3 -u sq09_requench.py $GITHUB_WORKSPACE/out/submission.csv | grep -v "^SIDES" | tee $GITHUB_WORKSPACE/out/merge.log | tail -20
      - name: publish as release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=run-${{ github.run_number }}
          gh release create "$TAG" out/submission.csv --title "hop run ${{ github.run_number }}" --notes "certified merge of run ${{ github.run_id }}" --latest
          echo "https://github.com/${{ github.repository }}/releases/download/$TAG/submission.csv"
      - name: submit to Kaggle when better than our best submission (token configured, daily budget left)
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          if [ -z "$KAGGLE_KEY" ]; then echo "no Kaggle token: skipped"; exit 0; fi
          mkdir -p ~/.kaggle && printf '{"username":"%s","key":"%s"}' "$KAGGLE_USERNAME" "$KAGGLE_KEY" > ~/.kaggle/kaggle.json && chmod 600 ~/.kaggle/kaggle.json
          export KAGGLE_API_TOKEN="$KAGGLE_KEY"
          python3 hop/kaggle_submit.py out/merge.log out/submission.csv "GitHub ${{ inputs.label }} hop run ${{ github.run_number }}" | tee -a out/merge.log
      - name: commit the merge as the chain's seed file and update the responsive-puzzle list
        if: inputs.label != ''
        run: |
          gzip -9 -c out/submission.csv > "seeds/${{ inputs.label }}.csv.gz"
          python3 hop/update_soft.py slices out/submission.csv hop/soft_list.txt | tee -a out/merge.log
          git config user.name "squares-hop bot" && git config user.email "bot@users.noreply.github.com"
          git add "seeds/${{ inputs.label }}.csv.gz" hop/soft_list.txt
          git commit -q -m "seeds: ${{ inputs.label }} = merge of hop run ${{ github.run_number }}" || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep $((i * 10)); done
      - name: dispatch the next run of the chain
        if: inputs.chain != '0' && inputs.chain != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NEXT=$(( ${{ inputs.chain }} - 1 )); SEED0=$(( ${{ inputs.seed0 }} + 1000 ))
          gh api -X POST "repos/${{ github.repository }}/actions/workflows/hop.yml/dispatches" -f ref=main \
            -f "inputs[jobs]=${{ inputs.jobs }}" -f "inputs[hop_min]=${{ inputs.hop_min }}" -f "inputs[seeds]=${{ inputs.seeds }}" \
            -f "inputs[seed0]=$SEED0" -f "inputs[budget_h]=${{ inputs.budget_h }}" -f "inputs[targets]=${{ inputs.targets }}" \
            -f "inputs[skip]=${{ inputs.skip }}" -f "inputs[hop_args]=${{ inputs.hop_args }}" -f "inputs[nmin]=${{ inputs.nmin }}" \
            -f "inputs[label]=${{ inputs.label }}" -f "inputs[chain]=$NEXT" -f "inputs[engine]=${{ inputs.engine }}" -f "inputs[nlist]=${{ inputs.nlist }}" -f "inputs[target_frac]=${{ inputs.target_frac }}"
          echo "dispatched the next run: chain $NEXT, seed0 $SEED0"
      - name: attach the merge log to the release (readable from the sandbox, unlike job logs)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "run-${{ github.run_number }}" out/merge.log --clobber || true
