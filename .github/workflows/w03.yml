name: w03
on:
  workflow_dispatch:
    inputs:
      groups:
        default: '["693,641,592"]'
      steps:
        default: -1,1
      cuts:
        default: '5'
      per_n:
        default: '2'
      sec:
        default: '120'
      minutes:
        default: '280'
      extra:
        default: ''
permissions:
  contents: write
jobs:
  j1:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJson(inputs.groups) }}
    steps:
    - uses: actions/checkout@v4
    - env:
        DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
      run: bash hop/data.sh pull
    - run: python3 "$GITHUB_WORKSPACE/ci/r.py" "$GITHUB_WORKSPACE/ci/w03_j1_1.sh"
    - run: python3 "$GITHUB_WORKSPACE/ci/r.py" "$GITHUB_WORKSPACE/ci/w03_j1_2.sh"
    - env:
        E1: ${{ matrix.group }}
        E2: ${{ inputs.minutes }}
        E3: ${{ inputs.steps }}
        E4: ${{ inputs.cuts }}
        E5: ${{ inputs.per_n }}
        E6: ${{ inputs.sec }}
        E7: ${{ inputs.extra }}
      run: python3 "$GITHUB_WORKSPACE/ci/r.py" "$GITHUB_WORKSPACE/ci/w03_j1_3.sh"
    - if: always()
      env:
        DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
      run: python3 "$GITHUB_WORKSPACE/ci/r.py" "$GITHUB_WORKSPACE/ci/w03_j1_4.sh"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: ${{ env.TAG }}
        path: out.tar.enc
        retention-days: 1
    - if: always()
      env:
        DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
      run: ls "$RUNNER_TEMP"/cilogs/*.log > /dev/null 2>&1 || exit 0; bash hop/data.sh release "logs-w03-${{ github.run_number }}" "logs w03 ${{ github.run_number }}" "step logs" "$RUNNER_TEMP"/cilogs/*.log || true
  j2:
    needs: j1
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: main
    - env:
        DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
      run: bash hop/data.sh pull
    - uses: actions/download-artifact@v4
      with:
        path: parts
    - env:
        DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
      run: python3 "$GITHUB_WORKSPACE/ci/r.py" "$GITHUB_WORKSPACE/ci/w03_j2_1.sh"
    - run: python3 "$GITHUB_WORKSPACE/ci/r.py" "$GITHUB_WORKSPACE/ci/w03_j2_2.sh"
    - env:
        GH_TOKEN: ${{ github.token }}
        DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
        E1: ${{ github.run_number }}
        E2: ${{ inputs.groups }}
        CI_PRIV_RELEASES: '1'
      run: python3 "$GITHUB_WORKSPACE/ci/r.py" "$GITHUB_WORKSPACE/ci/w03_j2_3.sh"
    - if: always()
      env:
        DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
      run: ls "$RUNNER_TEMP"/cilogs/*.log > /dev/null 2>&1 || exit 0; bash hop/data.sh release "logs-w03-${{ github.run_number }}" "logs w03 ${{ github.run_number }}" "step logs" "$RUNNER_TEMP"/cilogs/*.log || true
