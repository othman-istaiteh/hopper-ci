name: kaggle_scan
# Lists the competition's public notebooks (by score and by last run) and our submissions through the Kaggle API and
# publishes the listings as assets of the rolling release "scan", readable without a browser.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: kaggle CLI
        run: pip install -q kaggle
      - name: scan
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ~/.kaggle && printf '{"username":"%s","key":"%s"}' "$KAGGLE_USERNAME" "$KAGGLE_KEY" > ~/.kaggle/kaggle.json && chmod 600 ~/.kaggle/kaggle.json
          export KAGGLE_API_TOKEN="$KAGGLE_KEY"
          C=$(echo c3F1YXJlcy1pbi1zcXVhcmVz | base64 -d)
          mkdir -p out
          kaggle kernels list --competition "$C" --sort-by scoreAscending --page-size 40 -v > out/kernels_by_score.csv || true
          kaggle kernels list --competition "$C" --sort-by dateRun --page-size 40 -v > out/kernels_by_date.csv || true
          kaggle competitions submissions -c "$C" -v > out/submissions.csv || true
          kaggle competitions leaderboard -c "$C" --show > out/leaderboard_top.txt || true
          mkdir -p lb && kaggle competitions leaderboard -c "$C" --download -p lb && (cd lb && unzip -o -q *.zip && ls) && python3 - <<'PY' > out/our_rank.txt || true
          import csv, glob
          rows = list(csv.DictReader(open(glob.glob('lb/*.csv')[0])))
          rows.sort(key=lambda r: float(r['Score']))
          for i, r in enumerate(rows, 1):
              if 'Mais Oui' in r['TeamName'] or i <= 3 or i in (50, 80, 90, 100):
                  print(i, r['TeamName'], r['Score'], r.get('SubmissionDate', ''))
          print('teams', len(rows))
          PY
          mkdir -p board && kaggle kernels output inversion/squares-in-squares-per-puzzle-leaderboard -p board || true
          ls -la board; for f in board/*.csv board/*.txt board/*.json; do [ -f "$f" ] && cp "$f" "out/board_$(basename "$f")"; done; true
          wc -l out/*
          gh release create scan out/* --title "scan" --notes "Kaggle API listings" 2>/dev/null || gh release upload scan out/* --clobber
