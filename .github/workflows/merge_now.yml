name: merge_now
# On-demand certified merge and submission: seeds + results + the latest notebook merge output (Kaggle API) + the
# submission.csv assets of the given releases; publishes release merge-<run_number> (submission.csv, merge.log) and
# submits to Kaggle when better than our best submission (hop/kaggle_submit.py rules).
on:
  # 8 Nov (Othman): 6 submission slots a day, every 4 hours, at 02:23 06:23 10:23 14:23 18:23 22:23 French winter time
  # (01:23 ... 21:23 UTC, inside one Kaggle day, the last one 2.5 h before the 00:00 UTC reset). Each slot submits any
  # certified gain; the daily cap of 8 counts every submission of the day, so 2 stay free for emergencies (Kaggle allows 10).
  schedule:
    - cron: '23 1,5,9,13,17,21 * * *'
  workflow_dispatch:
    inputs:
      releases:
        description: comma-separated release tags whose submission.csv to include (e.g. "run-7,run-10,polish-1")
        default: ""
      fetch_kaggle:
        description: include the latest output of our merge notebook ("yes" / "no")
        default: "yes"
      max_per_day:
        description: daily cap for automatic submissions in this run (KAGGLE_MAX_PER_DAY)
        default: "8"
      min_gain:
        description: minimum gain over our best submission to submit (KAGGLE_MIN_GAIN; any certified gain since 8 Nov)
        default: "1e-7"

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: our packings (private data repo)
        env:
          DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
        run: bash hop/data.sh pull
      - name: python deps
        run: pip install -q numpy mpmath kaggle
      - name: gather candidates
        env:
          DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p slices out
          for f in seeds/*.csv.gz results/*.csv.gz; do n=$(basename "$f" .csv.gz); mkdir -p "slices/$n"; gunzip -c "$f" > "slices/$n/submission.csv"; done
          for t in $(echo "${{ inputs.releases }}" | tr ',' ' '); do
            mkdir -p "slices/rel_${t//-/_}"
            bash hop/data.sh dl "$t" submission.csv "slices/rel_${t//-/_}"
          done
          if [ "${{ inputs.fetch_kaggle || 'yes' }}" = "yes" ] && [ -n "$KAGGLE_KEY" ]; then
            mkdir -p ~/.kaggle && printf '{"username":"%s","key":"%s"}' "$KAGGLE_USERNAME" "$KAGGLE_KEY" > ~/.kaggle/kaggle.json && chmod 600 ~/.kaggle/kaggle.json
            export KAGGLE_API_TOKEN="$KAGGLE_KEY"
            mkdir -p slices/kaggle_merge
            kaggle kernels output "$KAGGLE_USERNAME/notebook5586544269" -p slices/kaggle_merge || echo "Kaggle output fetch failed"
            find slices/kaggle_merge -type f ! -name submission.csv -delete || true
            for k in sq10-cpu-hop-c sq10-cpu-hop-d; do mkdir -p "slices/kaggle_${k##*-}"; kaggle kernels output "$KAGGLE_USERNAME/$k" -p "slices/kaggle_${k##*-}" > /dev/null 2>&1 || echo "no output from $k"; find "slices/kaggle_${k##*-}" -type f ! -name submission.csv -delete || true; done
            # Colab worker results (private dataset <user>/sq-colab-hop, one CSV of improved puzzles per round)
            mkdir -p colab_dl && kaggle datasets download "$KAGGLE_USERNAME/sq-colab-hop" -p colab_dl --unzip -q 2>/dev/null || echo "no Colab dataset"
            for g in colab_dl/colab_*.csv; do [ -f "$g" ] || continue; n=$(basename "$g" .csv); mkdir -p "slices/$n"; cp "$g" "slices/$n/submission.csv"; done
          fi
          ls slices
      - name: certified merge
        run: |
          cd hop
          python3 expand.py $GITHUB_WORKSPACE/slices $GITHUB_WORKSPACE/slices/expand/submission.csv || echo "expand failed"
          SQ_IN=$GITHUB_WORKSPACE/slices SQ_QUENCH=0 SQ_MAXC=3 SQ_WORKERS=$(nproc) \
          python3 -u sq09_requench.py $GITHUB_WORKSPACE/out/submission.csv | grep -v "^SIDES" | tee $GITHUB_WORKSPACE/out/merge.log | tail -20
      - name: publish and submit
        env:
          DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=merge-${{ github.run_number }}
          # retry: a GitHub 5xx here once cost a whole merge (4 Nov); if the release exists, just upload the file
          for i in 1 2 3 4 5; do
            if gh release view "$TAG" > /dev/null 2>&1; then break
            else gh release create "$TAG" --title "on-demand merge ${{ github.run_number }}" --notes "${{ github.event_name }} releases: ${{ inputs.releases }}" && break; fi
            [ $i -eq 5 ] && exit 1; sleep $((i * 15))
          done
          bash hop/data.sh release "$TAG" "on-demand merge ${{ github.run_number }}" "releases: ${{ inputs.releases }}" out/submission.csv
          if [ -n "$KAGGLE_KEY" ]; then
            mkdir -p ~/.kaggle && printf '{"username":"%s","key":"%s"}' "$KAGGLE_USERNAME" "$KAGGLE_KEY" > ~/.kaggle/kaggle.json && chmod 600 ~/.kaggle/kaggle.json
            export KAGGLE_API_TOKEN="$KAGGLE_KEY"
            KAGGLE_MIN_SPACING_H=3 KAGGLE_MAX_PER_DAY=${{ inputs.max_per_day || '8' }} KAGGLE_MIN_GAIN=${{ inputs.min_gain || '1e-7' }} python3 hop/kaggle_submit.py out/merge.log out/submission.csv "GitHub on-demand merge ${{ github.run_number }} (${{ inputs.releases }})" | tee -a out/merge.log
          fi
          gh release upload "$TAG" out/merge.log --clobber
