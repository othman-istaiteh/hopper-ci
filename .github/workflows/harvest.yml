name: harvest
# Daily harvest of public notebook outputs (Kaggle API): download the outputs of the most recent and the most voted
# public notebooks of the competition (or an explicit list), certify-merge them against our seeds + results, and commit
# the puzzles that beat ours as results/harvest_<date>.csv.gz (picked up by every later merge). Release harvest-<n>.
on:
  workflow_dispatch:
    inputs:
      refs:
        description: comma-separated notebook refs (user/slug); empty = top recent + top voted from the kernel listings
        default: ""
      top:
        description: how many notebooks from each listing when refs is empty
        default: "15"
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: python deps
        run: pip install -q numpy mpmath kaggle
      - name: download public outputs
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          REFS: ${{ inputs.refs }}
          TOP: ${{ inputs.top }}
        run: |
          mkdir -p ~/.kaggle && printf '{"username":"%s","key":"%s"}' "$KAGGLE_USERNAME" "$KAGGLE_KEY" > ~/.kaggle/kaggle.json && chmod 600 ~/.kaggle/kaggle.json
          export KAGGLE_API_TOKEN="$KAGGLE_KEY"
          COMP=$(echo c3F1YXJlcy1pbi1zcXVhcmVz | base64 -d)
          mkdir -p pub slices out
          if [ -z "$REFS" ]; then
            T=${TOP:-15}
            kaggle kernels list --competition "$COMP" --sort-by dateRun --page-size $T --csv 2>/dev/null | tail -n +2 | cut -d, -f1 > refs.txt
            kaggle kernels list --competition "$COMP" --sort-by voteCount --page-size $T --csv 2>/dev/null | tail -n +2 | cut -d, -f1 >> refs.txt
            kaggle kernels list --competition "$COMP" --sort-by scoreAscending --page-size $T --csv 2>/dev/null | tail -n +2 | cut -d, -f1 >> refs.txt
            REFS=$(sort -u refs.txt | grep / | tr '\n' ',')
          fi
          echo "refs: $REFS"
          i=0
          for r in $(echo "$REFS" | tr ',' ' '); do
            i=$((i+1)); d="pub/$(echo "$r" | tr '/' '_')"; mkdir -p "$d"
            timeout 600 kaggle kernels output "$r" -p "$d" > /dev/null 2>&1 || { echo "  $r: no output"; continue; }
            k=0
            for f in $(find "$d" -type f -name '*.csv' -size +100k); do
              if head -1 "$f" | grep -q "square_id"; then k=$((k+1)); mkdir -p "slices/pub${i}_$k"; cp "$f" "slices/pub${i}_$k/submission.csv"; fi
            done
            echo "  $r: $k submission files"
            rm -rf "$d"
          done
          mkdir -p ours
          for f in seeds/*.csv.gz results/*.csv.gz; do n=$(basename "$f" .csv.gz); mkdir -p "ours/$n" "slices/$n"; gunzip -c "$f" > "ours/$n/submission.csv"; cp "ours/$n/submission.csv" "slices/$n/submission.csv"; done
          ls slices | wc -l
      - name: certified merge and keep the improvements
        run: |
          cd hop
          SQ_IN=$GITHUB_WORKSPACE/slices SQ_QUENCH=0 SQ_MAXC=3 SQ_WORKERS=$(nproc) \
          python3 -u sq09_requench.py $GITHUB_WORKSPACE/out/submission.csv | grep -v "^SIDES" | tee $GITHUB_WORKSPACE/out/merge.log | tail -8
          python3 improved_only.py $GITHUB_WORKSPACE/ours $GITHUB_WORKSPACE/out/submission.csv $GITHUB_WORKSPACE/out/improved.csv | tee -a $GITHUB_WORKSPACE/out/merge.log
      - name: commit and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(wc -l < out/improved.csv)" -gt 1 ]; then
            gzip -9 -c out/improved.csv > "results/harvest_$(date +%m%d).csv.gz"
            git config user.name "harvest bot" && git config user.email "harvest@users.noreply.github.com"
            git add results/ && git commit -q -m "results: public harvest $(date +%F)" || true
            for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep $((i * 30)); done
          else
            echo "nothing beats our packings"
          fi
          gh release create "harvest-${{ github.run_number }}" out/merge.log --title "harvest ${{ github.run_number }}" --notes "public notebook outputs" || true

  certs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: python deps
        run: pip install -q numpy mpmath
      - name: clone the certificate repositories (read only, sparse)
        run: |
          mkdir -p ext && cd ext
          sp() { git clone -q --depth 1 --filter=blob:none --sparse "https://github.com/$1.git" "$2" && (cd "$2" && git sparse-checkout set --no-cone $3) || echo "clone $1 failed"; }
          sp evand/square-packing evand "/search/packer/candidates/ /certificates/"
          sp Mishapolk/square-packing-records mishapolk "/certificates/"
          sp franciscouzo/square-packing couzo "/certificates/"
          sp dostashev/square-packing ostashev "/"
          sp itsnaka/squish-certs itsnaka "/"
          sp wand125/square-packing wand125 "/"
          sp griffcass/square-packing griffcass "/"
          sp jlevy/squares jlevy "/packing/"
          du -sh . ; find . -name "*.cert" | wc -l
      - name: our current best
        run: |
          mkdir -p ours slices out
          for f in seeds/*.csv.gz results/*.csv.gz; do n=$(basename "$f" .csv.gz); mkdir -p "slices/$n"; gunzip -c "$f" > "slices/$n/submission.csv"; done
          cd hop && python3 best_merge.py $GITHUB_WORKSPACE/slices $GITHUB_WORKSPACE/ours/best.csv
      - name: certificates below our sides
        run: |
          cd hop && python3 -I certs2csv.py $GITHUB_WORKSPACE/ours/best.csv $GITHUB_WORKSPACE/out/certs.csv $GITHUB_WORKSPACE/ext | tee $GITHUB_WORKSPACE/out/certs.log | tail -12
      - name: commit
        run: |
          if [ -s out/certs.csv ] && [ "$(wc -l < out/certs.csv)" -gt 1 ]; then
            gzip -9 -c out/certs.csv > "results/certs_$(date +%m%d).csv.gz"
            git config user.name "harvest bot" && git config user.email "harvest@users.noreply.github.com"
            git add results/ && git commit -q -m "results: certificate harvest $(date +%F)" || true
            for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep $((i * 30)); done
          else
            echo "no certificate beats our packings"
          fi
