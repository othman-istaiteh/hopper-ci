name: explore
# Evan Daniel's basin explorer (explore.py: quality-diversity over polished fq minima, kicks / melts / crossovers) started
# from our current packing of each puzzle. One job per task = comma-separated puzzle list, run one after the other.
# Basins below our side are certified in the publish job; the winners are committed as results/explore_<date>_<run>.csv.gz
# (every later merge picks them up). Release explore-<run_number>.
on:
  workflow_dispatch:
    inputs:
      tasks:
        description: JSON list of comma-separated puzzle lists, one job each
        default: '["299,335,412", "454,498,544"]'
      minutes:
        description: explorer minutes per puzzle
        default: "100"
      smax:
        description: stepping-stone ceiling above our side
        default: "0.02"
      queue:
        description: JSON list of further tasks; the publish job dispatches the next ones (as many as the width) with the same settings
        default: '[]'
      width:
        description: parallel explorer jobs per wave
        default: "6"
      chain:
        description: yes = dispatch the next wave from the queue / rotation when done
        default: "yes"

permissions:
  contents: write
  actions: write

jobs:
  explore:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        task: ${{ fromJson(inputs.tasks) }}
    steps:
      - uses: actions/checkout@v4
      - name: build fq, packer, anneal (evand, pinned)
        run: |
          git clone -q --filter=blob:none --sparse https://github.com/evand/square-packing.git evand
          cd evand && git checkout -q 0e76d9fe5e48fc2a614e3c132a0a3fd67e0a6a8d
          git sparse-checkout set --no-cone /search/packer/src/ /search/packer/Cargo.toml /search/packer/Cargo.lock "/search/packer/*.py" /search/packer/pk/
          cd search/packer && cargo build --release --bin fq --bin packer --bin anneal 2>&1 | tail -2
          ls target/release/fq target/release/packer target/release/anneal
      - name: python deps
        run: pip install -q numpy mpmath
      - name: our current best
        run: |
          mkdir -p slices ours
          for f in seeds/*.csv.gz results/*.csv.gz; do n=$(basename "$f" .csv.gz); mkdir -p "slices/$n"; gunzip -c "$f" > "slices/$n/submission.csv"; done
          cd hop && python3 best_merge.py $GITHUB_WORKSPACE/slices $GITHUB_WORKSPACE/ours/best.csv | tail -2
      - name: explore ${{ matrix.task }}
        env:
          EVAND_PACKER: ${{ github.workspace }}/evand/search/packer
        run: |
          mkdir -p out/x
          TAG="x$(echo '${{ matrix.task }}' | tr ',' '_')"; echo "TAG=$TAG" >> $GITHUB_ENV
          for n in $(echo "${{ matrix.task }}" | tr ',' ' '); do
            S=$(python3 design/ex_io.py start ours/best.csv $n start_$n.txt)
            SMAX=$(python3 -c "print($S + ${{ inputs.smax }})")
            (cd $EVAND_PACKER && timeout $(( ${{ inputs.minutes }} * 60 + 600 )) python3 -u explore.py --n $n --starts $GITHUB_WORKSPACE/start_$n.txt \
               --minutes ${{ inputs.minutes }} --procs $(nproc) --smax $SMAX --seed $(( n * 1000 + ${{ github.run_number }} )) --out $GITHUB_WORKSPACE/runs/$n > $GITHUB_WORKSPACE/out/ex_$n.log 2>&1 || true)
            (cd $EVAND_PACKER && python3 explore.py --report $GITHUB_WORKSPACE/runs/$n 2>&1 | head -3 >> $GITHUB_WORKSPACE/out/ex_$n.log || true)
            R=$(python3 design/ex_io.py basins runs/$n $n $S out/x)
            echo "$n ours $S: $R" | tee -a out/summary_$TAG.txt
            echo "::notice title=explore $n::ours $S, $R, $(grep -c '^ ' out/ex_$n.log) log lines"
          done
          mv out/x/*.csv out/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TAG }}
          path: out/

  publish:
    needs: explore
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: parts
      - name: python deps
        run: pip install -q numpy mpmath
      - name: certify, keep the improvements, publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p slices out ours
          cat parts/*/summary_*.txt > out/summary.txt 2>/dev/null || true
          for d in parts/*/; do cp "$d"/ex_*.log out/ 2>/dev/null || true
            for f in "$d"/*.csv; do [ -f "$f" ] || continue; t=$(basename "$f" .csv); mkdir -p "slices/$t"; cp "$f" "slices/$t/submission.csv"; done
          done
          ls slices | head -40
          for f in seeds/*.csv.gz results/*.csv.gz; do n=$(basename "$f" .csv.gz); mkdir -p "ours/$n" "slices/$n"; gunzip -c "$f" > "ours/$n/submission.csv"; cp "ours/$n/submission.csv" "slices/$n/submission.csv"; done
          (cd hop && SQ_IN=$GITHUB_WORKSPACE/slices SQ_QUENCH=0 SQ_MAXC=3 SQ_WORKERS=$(nproc) \
            python3 -u sq09_requench.py $GITHUB_WORKSPACE/out/submission.csv | grep -v "^SIDES" | tee $GITHUB_WORKSPACE/out/merge.log | tail -5
           python3 improved_only.py $GITHUB_WORKSPACE/ours $GITHUB_WORKSPACE/out/submission.csv $GITHUB_WORKSPACE/out/improved.csv | tee -a $GITHUB_WORKSPACE/out/merge.log)
          if [ -f out/improved.csv ] && [ "$(wc -l < out/improved.csv)" -gt 1 ]; then
            gzip -9 -c out/improved.csv > "results/explore_$(date +%m%d)_${{ github.run_number }}.csv.gz"
            git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add results/ && git commit -q -m "results: explorer ${{ github.run_number }}" || true
            for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep $((i * 30)); done
            echo "::notice title=improved::$(tail -3 out/merge.log | tr '\n' ' ' | cut -c1-500)"
          else
            echo "::notice title=improved::none"
          fi
          echo "::notice title=summary::$(tr '\n' ' ' < out/summary.txt | cut -c1-900)"
          gh release create "explore-${{ github.run_number }}" out/summary.txt out/merge.log out/ex_*.log --title "explore ${{ github.run_number }}" --notes "tasks ${{ inputs.tasks }}, ${{ inputs.minutes }} min per puzzle" 2> rel.err || echo "::warning::release failed $(head -c 400 rel.err)"
      - name: next tasks from the queue
        if: ${{ inputs.chain != 'no' }}
        env:
          GH_TOKEN: ${{ github.token }}
          QUEUE: ${{ inputs.queue }}
        run: |
          # an empty queue is refilled from design/explore_rotation.json, so the explorer keeps cycling until stopped
          python3 -c "import json,os; q=json.loads(os.environ['QUEUE'] or '[]') or json.load(open('design/explore_rotation.json')); json.dump(q,open('q.json','w'))"
          T=$(python3 -c "import json; q=json.load(open('q.json')); print(json.dumps(q[:${{ inputs.width }}]))")
          Q=$(python3 -c "import json; q=json.load(open('q.json')); print(json.dumps(q[${{ inputs.width }}:]))")
          if [ "$T" != "[]" ]; then
            gh workflow run explore.yml -f tasks="$T" -f queue="$Q" -f minutes=${{ inputs.minutes }} -f smax=${{ inputs.smax }} -f width=${{ inputs.width }}
            echo "::notice title=chain::next $T, queue $Q"
          fi
