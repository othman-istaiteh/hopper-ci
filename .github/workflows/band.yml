name: band
# Thick corner-to-corner band test (forum 755628, pjmathematician's recipe): per task, design/bandseed.py builds a rigid
# band seed for n at box side S with the band width bounded to [WMIN, WMAX], then hop/sq10_hop.py quenchhop (fq quench
# + packer hop at temp 1.0, several hop seeds in parallel) relaxes it for hop_min minutes. The publish job certifies
# every result and compares it with our current packing, publishes a release and (since 8 Nov) pushes certified
# improvements to results/ in the private repo.
on:
  workflow_dispatch:
    inputs:
      tasks:
        description: JSON list of "n:S:seed:wmin:wmax"
        default: '["498:22.95:1:1.5:3.5", "498:22.95:2:3.5:5.5", "498:22.95:3:5.5:8", "498:22.88:4:1.5:3.5", "498:22.88:5:3.5:5.5", "498:22.88:6:5.5:8"]'
      search_min:
        description: band search minutes per task
        default: "15"
      hop_min:
        description: relaxation minutes per task
        default: "200"
      hop_seeds:
        description: parallel hop seeds per task
        default: "4"
      engine:
        description: relaxer (sq10_hop HOP_ENGINE) - quenchhop (fq quench + packer hop) or quench (fq quench only, flags in hop_args)
        default: "quenchhop"
      hop_args:
        description: fq / packer options for the relaxer (engine quench, round15p5 = --loosen 1.0 --round-r0 0.15 --round-compress --round-press --round-steps 5 --round-press-outer 30)
        default: ""
      tau_max:
        description: largest overlap tolerance of the tolerant fill in bandseed.py
        default: "0.16"
      band_env:
        description: extra env for bandseed.py, e.g. "BAND_PHI=0:25 BAND_TH=3:30" (shallow full-span band, 12 Nov); empty = diagonal
        default: ""

permissions:
  contents: write

jobs:
  band:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        task: ${{ fromJson(inputs.tasks) }}
    steps:
      - uses: actions/checkout@v4
      - name: our code and packings (private repo)
        env:
          DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
        run: bash hop/data.sh pull
      - name: build packer and fq (evand, pinned)
        run: |
          git clone -q --filter=blob:none --sparse https://github.com/evand/square-packing.git evand
          cd evand && git checkout -q 0e76d9fe5e48fc2a614e3c132a0a3fd67e0a6a8d
          git sparse-checkout set --no-cone /search/packer/src/ /search/packer/Cargo.toml /search/packer/Cargo.lock "/search/packer/*.py"
          cd search/packer && cargo build --release --bin fq --bin packer 2>&1 | tail -2
          ls target/release/packer target/release/fq
      - name: python deps
        run: pip install -q numpy mpmath scipy
      - name: band seed ${{ matrix.task }}
        run: |
          IFS=: read N S SD W0 W1 <<< "${{ matrix.task }}"
          TAG="b${N}_${S}_${SD}"; echo "TAG=$TAG" >> $GITHUB_ENV
          mkdir -p out slices
          env ${{ inputs.band_env }} EVAND_PACKER=$GITHUB_WORKSPACE/evand/search/packer timeout $(( ${{ inputs.search_min }} * 60 + 600 )) \
          python3 -u design/bandseed.py $N $S $(( ${{ inputs.search_min }} * 60 )) $SD $W0 $W1 out/${TAG}_seed.csv ${{ inputs.tau_max }} 2>&1 | tee out/$TAG.log | tail -5
          echo "::notice title=$TAG seed::$(grep BANDSEED out/$TAG.log | cut -c1-600)"
      - name: relax the seed
        run: |
          [ -f out/${TAG}_seed.csv ] || { echo "no seed"; exit 0; }
          mkdir -p slices/$TAG && cp out/${TAG}_seed.csv slices/$TAG/submission.csv
          cd hop
          FQ_BIN=$GITHUB_WORKSPACE/evand/search/packer/target/release/fq \
          PACKER_BIN=$GITHUB_WORKSPACE/evand/search/packer/target/release/packer \
          SQ_IN=$GITHUB_WORKSPACE/slices SQ_WORK=$GITHUB_WORKSPACE/work SQ_BOARD=board_09nov.txt \
          SQ_WORKERS=$(nproc) SQ_MAXC=40 SQ_DEDUP=0 HOP_MIN=${{ inputs.hop_min }} HOP_SEEDS=${{ inputs.hop_seeds }} HOP_SEED0=900 \
          HOP_NTARGET=1000 HOP_BUDGET_H=5 FQ_DEADLINE=300 HOP_ENGINE=${{ inputs.engine }} HOP_ARGS="${{ inputs.hop_args }}" \
          timeout $(( ${{ inputs.hop_min }} * 60 + 1800 )) \
          python3 -u sq10_hop.py $GITHUB_WORKSPACE/out/${TAG}_relaxed.csv | grep -v "^SIDES" | tee -a $GITHUB_WORKSPACE/out/$TAG.log | tail -15 || true
      - name: seal the outputs (artifacts of a public repo are downloadable by anyone)
        if: always()
        env:
          DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
        run: bash hop/data.sh seal out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ env.TAG }}
          path: out.tar.enc
          retention-days: 1

  publish:
    needs: band
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # the latest main, not the dispatch-time commit: results committed during the run must be merged
      - name: our packings (private data repo)
        env:
          DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
        run: bash hop/data.sh pull
      - uses: actions/download-artifact@v4
        with:
          path: parts
      - name: unseal the artifacts
        env:
          DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
        run: bash hop/data.sh unseal parts
      - name: python deps
        run: pip install -q numpy mpmath
      - name: certify and compare with ours
        env:
          GH_TOKEN: ${{ github.token }}
          DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
        run: |
          mkdir -p slices out ours
          for d in parts/*/; do t=$(basename "$d"); cat "$d"/*.log > "out/$t.log" 2>/dev/null || true
            for f in "$d"/*.csv; do [ -f "$f" ] || continue; mkdir -p "slices/$(basename "$f" .csv)"; cp "$f" "slices/$(basename "$f" .csv)/submission.csv"; done
          done
          for f in seeds/*.csv.gz results/*.csv.gz; do n=$(basename "$f" .csv.gz); mkdir -p "ours/$n" "slices/$n"; gunzip -c "$f" > "ours/$n/submission.csv"; cp "ours/$n/submission.csv" "slices/$n/submission.csv"; done
          (cd hop && SQ_IN=$GITHUB_WORKSPACE/slices SQ_QUENCH=0 SQ_MAXC=3 SQ_WORKERS=$(nproc) \
            python3 -u sq09_requench.py $GITHUB_WORKSPACE/out/submission.csv | grep -v "^SIDES" | tee $GITHUB_WORKSPACE/out/merge.log | tail -5
           python3 improved_only.py $GITHUB_WORKSPACE/ours $GITHUB_WORKSPACE/out/submission.csv $GITHUB_WORKSPACE/out/improved.csv | tee -a $GITHUB_WORKSPACE/out/merge.log)
          python3 - <<'EOF' | tee out/summary.txt
          import csv, glob, math, os, collections
          def sides(p):
              d = collections.defaultdict(list)
              for r in csv.DictReader(open(p)):
                  d[int(r['n'])].append((float(r['x']), float(r['y']), float(r['angle'])))
              out = {}
              for n, q in d.items():
                  xs = []; ys = []
                  for x, y, a in q:
                      c, s = math.cos(a), math.sin(a)
                      for dx, dy in ((.5, .5), (.5, -.5), (-.5, .5), (-.5, -.5)):
                          xs.append(x + c * dx - s * dy); ys.append(y + s * dx + c * dy)
                  out[n] = (len(q), max(max(xs) - min(xs), max(ys) - min(ys)))
              return out
          best = {}
          for p in glob.glob('ours/*/submission.csv'):
              for n, (k, s) in sides(p).items():
                  if k == n and (n not in best or s < best[n]): best[n] = s
          for p in sorted(glob.glob('parts/*/*.csv')):
              for n, (k, s) in sides(p).items():
                  print('%s n=%d squares=%d side=%.6f ours=%.6f diff=%+.6f (uncertified bbox)' % (os.path.basename(p), n, k, s, best.get(n, 0), s - best.get(n, 0)))
          EOF
          # 8 Nov: certified improvements go straight to the private repo, so the next submission slot picks them up
          if [ -f out/improved.csv ] && [ "$(wc -l < out/improved.csv)" -gt 1 ]; then
            F="results/band_$(date +%m%d)_${{ github.run_number }}.csv.gz"; gzip -9 -c out/improved.csv > "$F"
            DATA_TOKEN="$DATA_TOKEN" bash hop/data.sh push "results: band run ${{ github.run_number }}" "$F"
          fi
          gh release create "band-${{ github.run_number }}" out/summary.txt out/merge.log out/b*.log --title "band ${{ github.run_number }}" --notes "tasks ${{ inputs.tasks }}" 2> rel.err || echo "::warning::release failed $(head -c 400 rel.err)"
          echo "::notice title=summary::$(cat out/summary.txt | tr '\n' ' ' | cut -c1-1500)"
