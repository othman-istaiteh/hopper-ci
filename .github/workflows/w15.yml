name: w15
on:
  workflow_dispatch:
    inputs:
      dataset:
        default: ''
      files:
        default: ''
permissions:
  contents: write
jobs:
  j1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - env:
        DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
      run: bash hop/data.sh ci
    - run: python3 "$GITHUB_WORKSPACE/ci/r.py" "$GITHUB_WORKSPACE/ci/w15_j1_1.sh"
    - env:
        KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        GH_TOKEN: ${{ github.token }}
        E1: ${{ inputs.files }}
        E2: ${{ inputs.dataset }}
        E3: ${{ github.run_number }}
        DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
        CI_PRIV_RELEASES: '1'
      run: python3 "$GITHUB_WORKSPACE/ci/r.py" "$GITHUB_WORKSPACE/ci/w15_j1_2.sh"
    - if: always()
      env:
        DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
      run: ls "$RUNNER_TEMP"/cilogs/*.log > /dev/null 2>&1 || exit 0; bash hop/data.sh release "logs-w15-${{ github.run_number }}" "logs w15 ${{ github.run_number }}" "step logs" "$RUNNER_TEMP"/cilogs/*.log || true
